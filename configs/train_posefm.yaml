# Training configuration for PoseFM (Euclidean baseline)
model:
  type: "PoseFM"
  num_joints: 21
  hidden_dim: 512
  num_layers: 4
  activation: "silu"

training:
  total_steps: 50000
  batch_size: 4096
  optimizer:
    type: "AdamW"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
  ema:
    decay: 0.99
  scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6
  eval_interval: 500
  save_interval: 2500

data:
  dataset: "AMASS"
  data_dir: "data/amass"
  sampling_rate: 30
  trim_pct: 0.10
  num_workers: 8

logging:
  project: "posedflow_reproduction"
  checkpoint_dir: "checkpoints/posefm"
